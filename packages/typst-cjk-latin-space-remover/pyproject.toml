[project]
name = "typst-cjk-latin-space-remover"
version = "0.1.0"
description = "CLI: remove spaces between CJK and Latin/digits in Typst files, math- and raw-safe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
typst-cjk-latin-space-remover = "typst_cjk_latin_space_remover.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typst_cjk_latin_space_remover"]
# See the mdformat package's pyproject for why the tracked file is excluded.
exclude = ["src/typst_cjk_latin_space_remover/_core.py"]

# Build-time vendor of the shared core. See the mdformat
# package's pyproject and hatch_build.py for the rationale; the tracked _core.py
# serves development and the wheel gets a force-included shim in its place.
[tool.hatch.build]
artifacts = ["src/typst_cjk_latin_space_remover/_cjk_latin_space.py"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]

[dependency-groups]
dev = ["cjk-latin-space"]

[tool.uv.sources]
cjk-latin-space = { workspace = true }
