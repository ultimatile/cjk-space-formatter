# uv workspace root (virtual — not itself a package).
#
# Layout rationale: the published surface is two packages, not two
# repos. They share a core, so a monorepo keeps a single source of truth and
# atomic changes; independent PyPI release cycles are still possible per package.
#
#   packages/mdformat-no-cjk-latin-space/   # PyPI
#   packages/typst-cjk-latin-space-remover/ # PyPI
#   core/                                   # cjk-latin-space core (build-time vendored, not published)
#   conformance/                            # pure-run core corpus (target-independent)

[tool.uv.workspace]
members = ["packages/*", "core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cjk-latin-space",
    "mdformat-no-cjk-latin-space",
    "typst-cjk-latin-space-remover",
]

[tool.uv.sources]
cjk-latin-space = { workspace = true }
mdformat-no-cjk-latin-space = { workspace = true }
typst-cjk-latin-space-remover = { workspace = true }
