# uv workspace root (virtual — not itself a package).
#
# Layout rationale: the intended published surface is separate packages, not
# separate repos. The Python packages share a core, so a monorepo keeps a single
# source of truth and atomic changes; independent release cycles stay possible
# per package. The Typst CLI is a Rust package rooted at the repository's
# Cargo.toml; it is not part of this uv workspace.
#
#   packages/mdformat-no-cjk-latin-space/       # usable; not on PyPI yet
#   packages/markdown-cjk-latin-space-remover/  # usable; not on PyPI yet
#   core/                                       # cjk-latin-space core (build-time vendored, not published)
#   conformance/                                # pure-run corpus, read by the Python core and the Rust crate
#   crates/typst-cjk-latin-space-remover/       # Typst CLI sources (Rust; manifest is the root Cargo.toml)
#   crates/cjk-latin-space-typst-core/          # Rust crate the Typst CLI is built on

[tool.uv.workspace]
members = ["packages/*", "core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cjk-latin-space",
    "mdformat-no-cjk-latin-space",
    "markdown-cjk-latin-space-remover",
]

[tool.uv.sources]
cjk-latin-space = { workspace = true }
mdformat-no-cjk-latin-space = { workspace = true }
markdown-cjk-latin-space-remover = { workspace = true }
